# omarchy-predatorsense-lite: gravação pelo grupo input nos controles de modo, timeout e limite de carga.
# Caminhos que não existem (facer ausente, por exemplo) são ignorados.
z /sys/firmware/acpi/platform_profile                0664 root input -
z /sys/devices/platform/acer-wmi/thermal_profile    0664 root input -
z /sys/devices/platform/acer-wmi/backlight_timeout  0664 root input -
z /sys/bus/wmi/drivers/acer-wmi-battery/health_mode 0664 root input -
